services:
  postgres:
    image: postgres:16-alpine
    container_name: jmc-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: password
      POSTGRES_DB: database
    ports:
      - "10000:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U root -d database" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jmc-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      NUXT_MODE: production
      NUXT_JWT_SECRET: your_jwt_secret_key
      NUXT_DATABASE_URL: postgresql://root:password@postgres:5432/database
      DATABASE_URL: postgresql://root:password@postgres:5432/database
      NUXT_PG_HOST: postgres
      NUXT_PG_PORT: 5432
      NUXT_PG_USER: root
      NUXT_PG_PASSWORD: password
      NUXT_PG_DATABASE: database
      NUXT_PG_MAX: 10
      NUXT_PG_IDLE_TIMEOUT: 30000
      NUXT_PG_CONNECTION_TIMEOUT: 2000
      NUXT_PG_SSL: false
      NUXT_PUBLIC_API_BASE_URL: http://localhost:3000

volumes:
  pgdata:
